# Development environment of the PAWS project.
#
# pixi installs the exact same tools locally and in the CI, from the
# versions frozen in pixi.lock. Usage:
#   pixi run build-firmware   # build every PlatformIO project
#   pixi run test             # run the firmware tests on the computer
#   pixi run book             # render the book (fails on missing includes)
#   pixi run api-docs         # firmware API documentation (after the book)
#   pixi run preview          # live preview of the book in the browser
#   pixi run dummy-server     # start the Phase 3 dummy backend server
#   pixi run test-server      # start the Phase 4 test server (upload v1)
#   pixi run backend          # start the backend on this computer (port 8080)
#   pixi run backend-demo     # the same, with 3 years of made-up data
#   pixi run backend-test     # run the tests of the backend
#   pixi run deploy-backend   # deploy the committed backend to the server
#
# Not managed here: LaTeX (texlive with circuitikz, latexmk, pdf2svg),
# only needed to regenerate the wiring diagrams (docs/assets/diagrams-src).

[workspace]
name = "paws"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
platformio = "6.2.*"
quarto = "1.7.*"
cxx-compiler = "*"      # g++ for the tests running on the computer
doxygen = "1.18.*"
uv = "0.12.*"            # Python packages of the backend (same as on the server)

[activation.env]
# Keep PlatformIO packages (ESP32 toolchain, libraries) inside the
# project instead of the user's ~/.platformio
PLATFORMIO_CORE_DIR = "$PIXI_PROJECT_ROOT/.pio-core"

[tasks]
build-firmware = "bash scripts/build-firmware.sh"
test = "pio test -d firmware/paws -e native"
book = "bash scripts/render-book.sh"
api-docs = { cmd = "doxygen Doxyfile", cwd = "firmware/paws" }
preview = { cmd = "quarto preview", cwd = "docs" }
# Backend (backend/paws): uv installs its Python and packages from uv.lock,
# as on the server
backend = { cmd = "uv run uvicorn paws_server.main:app --host 0.0.0.0 --port 8080 --reload", cwd = "backend/paws" }
backend-demo = { cmd = "uv run python dev/make_test_data.py && uv run uvicorn paws_server.main:app --host 0.0.0.0 --port 8080 --reload", cwd = "backend/paws", env = { PAWS_DATA_DIR = "dev/data" } }
backend-test = { cmd = "uv run --locked pytest", cwd = "backend/paws" }
deploy-backend = "bash scripts/deploy-backend.sh"

# Backend: a separate environment, because PlatformIO requires an old
# version of uvicorn (for its own web interface) that FastAPI cannot use
[feature.backend.dependencies]
python = "3.12.*"
fastapi = ">=0.139"
uvicorn-standard = ">=0.51"

[feature.backend.tasks]
dummy-server = { cmd = "python main.py", cwd = "backend/Phase-03/dummy_server" }
test-server = { cmd = "python main.py", cwd = "backend/Phase-04/test_server" }

[environments]
backend = { features = ["backend"], no-default-feature = true }
