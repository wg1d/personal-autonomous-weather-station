; PAWS firmware: a single project, one environment per board and use.
;   pio run -e xiao          -> the outdoor station (XIAO ESP32-S3)
;   pio run -e xiao-bench    -> the same, with short periods for the bench
;   pio run -e esp32         -> the bench station (uPesy ESP32 Wrover)
;   pio run -e esp32-bench   -> the same, with short periods for the bench
;   pio test -e native       -> runs the core tests on the computer
; The pins of each board are in src/adapters/Board.h.

[platformio]
; `pio run` without -e builds the firmware of both boards
default_envs = esp32, xiao

[env:esp32]
platform = espressif32 @ 6.5.0
board = upesy_wrover
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit BME280 Library @ 2.3.0
; Firmware version computed by Git at each build (see version.py)
build_flags = !python version.py

[env:esp32-bench]
; The firmware of the station with short periods, to see the whole cycle
; on the bench: one measurement per minute, one upload every 5 minutes
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D PAWS_BENCH_DEMO=1

[env:xiao]
platform = espressif32 @ 6.5.0
board = seeed_xiao_esp32s3
framework = arduino
; 8 MB of flash memory: a large partition for the files (see the file)
board_build.partitions = partitions_xiao.csv
monitor_speed = 115200
; The USB port of the XIAO is part of the ESP32-S3: it only sends the
; serial output to a monitor that sets the DTR line. RTS stays off: with
; DTR, it would restart the chip into its programming mode.
monitor_dtr = 1
monitor_rts = 0
lib_deps = ${env:esp32.lib_deps}
build_flags =
    !python version.py
    -D PAWS_BOARD_XIAO=1

[env:xiao-bench]
; The outdoor station with short periods, as esp32-bench
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -D PAWS_BENCH_DEMO=1

[env:native]
; Builds lib/ (core and interfaces) and test/ with the computer's g++.
; src/ is not built: it needs the Arduino framework. The C++ version
; is the one of the Arduino core, so the tests compile like the board.
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -I test/doubles
