; PAWS firmware: a single project with three environments.
;   pio run                  -> builds the firmware of the station (esp32)
;   pio run -e esp32-bench   -> the same, with short periods for the bench
;   pio test -e native       -> runs the core tests on the computer

[platformio]
; `pio run` without -e only builds the board firmware
default_envs = esp32

[env:esp32]
platform = espressif32 @ 6.5.0
board = upesy_wrover
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit BME280 Library @ 2.3.0
; Firmware version computed by Git at each build (see version.py)
build_flags = !python version.py

[env:esp32-bench]
; The firmware of the station with short periods, to see the whole cycle
; on the bench: one measurement per minute, one upload every 5 minutes
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D PAWS_BENCH_DEMO=1

[env:native]
; Builds lib/ (core and interfaces) and test/ with the computer's g++.
; src/ is not built: it needs the Arduino framework. The C++ version
; is the one of the Arduino core, so the tests compile like the board.
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -I test/doubles
