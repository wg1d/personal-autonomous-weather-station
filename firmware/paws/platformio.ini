; PAWS firmware: a single project with two environments.
;   pio run                  -> builds the firmware for the board (esp32)
;   pio test -e native       -> runs the core tests on the computer

[platformio]
; `pio run` without -e only builds the board firmware
default_envs = esp32

[env:esp32]
platform = espressif32 @ 6.5.0
board = upesy_wrover
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit BME280 Library @ 2.3.0

[env:native]
; Builds lib/ (core and interfaces) and test/ with the computer's g++.
; src/ is not built: it needs the Arduino framework. The C++ version
; is the one of the Arduino core, so the tests compile like the board.
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -I test/doubles
