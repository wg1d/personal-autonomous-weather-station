; Bench check: lists the I2C modules and shows the state of the button and
; of the clock alarm, every two seconds, on the XIAO ESP32-S3 (step O2).
;
;   pio run -d firmware/tools/bench_check -t upload -t monitor

[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32 @ 6.5.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; The USB port of the XIAO only sends to a monitor that sets DTR
monitor_dtr = 1
monitor_rts = 0
