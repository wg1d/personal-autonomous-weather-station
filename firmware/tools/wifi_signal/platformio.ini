; Wi-Fi signal test: shows the strength of the Wi-Fi signal every second,
; on the serial monitor and on a web page, to check the range in the
; garden before the outdoor station is built (step O0).
;
;   pio run -d firmware/tools/wifi_signal -t upload -t monitor

[platformio]
src_dir = .

[env:upesy_wrover]
platform = espressif32 @ 6.5.0
board = upesy_wrover
framework = arduino
monitor_speed = 115200
; The Wi-Fi name and password come from the secrets of the station
build_flags = -I ../../paws/include
