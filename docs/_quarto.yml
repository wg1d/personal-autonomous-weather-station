project:
  type: book
  output-dir: _output

book:
  title: "PAWS"
  subtitle: "Personal Autonomous Weather Station"
  repo-url: https://github.com/wg1d/personal-autonomous-weather-station
  repo-branch: main
  sidebar:
    tools:
      # Doxygen documentation of firmware/paws, published with the book
      - icon: file-earmark-code
        href: https://wg1d.github.io/personal-autonomous-weather-station/api/
        text: Firmware API documentation
  date: last-modified
  reader-mode: false

  chapters:
    - index.qmd
    - href: chapters/01-motivation.qmd
      text: "Motivation"
    - chapters/02-roadmap.qmd
    - part: "Phase 1 – Core"
      chapters:
        - href: chapters/PoC/Phase-01/01-components.qmd
          text: "Components"
        - chapters/PoC/Phase-01/02-data-acquisition.qmd
        - chapters/PoC/Phase-01/03-data-storage.qmd
        - chapters/PoC/Phase-01/04-real-time-clock.qmd
    - part: "Phase 2 – Power"
      chapters:
        - href: chapters/PoC/Phase-02/01-deep-sleep.qmd
          text: "Deep Sleep"
        - href: chapters/PoC/Phase-02/02-hardware-modifications.qmd
          text: "Hardware Changes"
        - href: chapters/PoC/Phase-02/03-software-implementation.qmd
          text: "Firmware"
    - part: "Phase 3 – Wi-Fi"
      chapters:
        - href: chapters/PoC/Phase-03/01-wifi-station.qmd
          text: "Wi-Fi Upload"
        - href: chapters/PoC/Phase-03/02-dummy-backend.qmd
          text: "Dummy Server"
        - href: chapters/PoC/Phase-03/03-fallback-ap.qmd
          text: "Fallback AP"
        - href: chapters/PoC/Phase-03/04-ntp-sync.qmd
          text: "NTP Sync"
        - href: chapters/PoC/Phase-03/05-power-budget.qmd
          text: "Power Budget"
    - part: "Phase 4 – Architecture"
      chapters:
        - href: chapters/Architecture/Phase-04/00-1-requirements.qmd
          text: "Requirements"
        - href: chapters/Architecture/Phase-04/00-2-behavior.qmd
          text: "Behavior"
        - href: chapters/Architecture/Phase-04/00-3-data-and-upload.qmd
          text: "Data & Upload"
        - href: chapters/Architecture/Phase-04/00-4-structure-and-verification.qmd
          text: "Structure & Verification"
    - part: "A1 – FSM Skeleton"
      chapters:
        - href: chapters/Architecture/Phase-04/01-1-interfaces-and-state-machine.qmd
          text: "Interfaces & State Machine"
        - href: chapters/Architecture/Phase-04/01-2-tests.qmd
          text: "Tests"
        - href: chapters/Architecture/Phase-04/01-3-walking-skeleton.qmd
          text: "Walking Skeleton"
    # Early drafts of the next steps (A3, A4), to be rewritten
    - part: "Drafts"
      chapters:
        - href: chapters/Architecture/Phase-04/02-sensor-and-storage.qmd
          text: "Sensor & Storage"
        - href: chapters/Architecture/Phase-04/03-network-and-time.qmd
          text: "Network & Time"

filters:
  - include-code-files

format:
  html:
    theme:
      - cosmo
      - custom.scss
    fig-align: center
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4
    highlight-style: github
    code-fold: false
    html-math-method: katex
    smooth-scroll: true
    mermaid:
      theme: neutral
