project:
  type: book
  output-dir: _output

book:
  title: "PAWS"
  subtitle: "Personal Autonomous Weather Station"
  repo-url: https://github.com/wg1d/personal-autonomous-weather-station
  repo-branch: main
  date: last-modified
  reader-mode: false

  chapters:
    - index.qmd
    - chapters/01-motivation.qmd
    - chapters/02-roadmap.qmd
    - part: "Phase 1: Core Functionality"
      chapters:
        - chapters/Phase-01/01-components.qmd
        - chapters/Phase-01/02-data-acquisition.qmd
        - chapters/Phase-01/03-data-storage.qmd
        - chapters/Phase-01/04-real-time-clock.qmd
    - part: "Phase 2: Power Management"
      chapters:
        - chapters/Phase-02/01-deep-sleep.qmd
        - chapters/Phase-02/02-hardware-modifications.qmd
        - chapters/Phase-02/03-software-implementation.qmd
    - part: "Phase 3: Wi-Fi & Data Transmission"
      chapters:
        - chapters/Phase-03/01-wifi-station.qmd
        - chapters/Phase-03/02-dummy-backend.qmd

format:
  html:
    theme: cosmo
    fig-align: center
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 4
    highlight-style: github
    code-fold: false
    html-math-method: katex
    smooth-scroll: true
    mermaid:
      theme: neutral
