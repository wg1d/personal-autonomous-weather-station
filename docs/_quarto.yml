          - href: chapters/Backend/00-design.qmd
            text: "Design"
          - href: chapters/Backend/01-ingestion.qmd
            text: "B1 – Ingestion"

date: last-modified

filters:
  - include-code-files

format:
  html:
    theme:
      - cosmo
      - custom.scss
    fig-align: center
    toc: true
    toc-depth: 4
    number-sections: false
    number-depth: 4
    highlight-style: github
    code-fold: false
    html-math-method: katex
    smooth-scroll: true
    mermaid:
      theme: neutral
