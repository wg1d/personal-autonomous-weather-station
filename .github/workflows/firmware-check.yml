name: Firmware Build Check

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-check.yml'
      # Development environment
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: firmware-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all PlatformIO projects
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pixi
        # Installs the tools frozen in pixi.lock (same versions as locally)
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: v0.50.1
          cache: true

      - name: Build
        # Creates placeholder secrets.h files, then builds every project
        run: pixi run build-firmware
