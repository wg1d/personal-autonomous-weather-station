name: Render & Deploy Quarto Book

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # Code files included in the book
      - 'firmware/**/*.ino'
      - 'firmware/**/*.h'
      - 'firmware/**/*.cpp'
      - 'firmware/**/platformio.ini'
      - 'backend/**/*.py'
      - '.github/workflows/publish.yml'
      # Development environment
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pixi
        # Installs the tools frozen in pixi.lock (same versions as locally)
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: v0.50.1
          cache: true

      - name: Render book
        run: pixi run book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_output

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
