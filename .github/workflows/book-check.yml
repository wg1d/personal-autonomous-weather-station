name: Book Render Check

on:
  pull_request:
    paths:
      - 'docs/**'
      # Code files included in the book
      - 'firmware/**/*.ino'
      - 'firmware/**/*.h'
      - 'firmware/**/*.cpp'
      - 'firmware/**/platformio.ini'
      - 'backend/**/*.py'
      - '.github/workflows/book-check.yml'
      # Development environment
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: book-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Quarto book
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the book includes the code of each version tag
          fetch-depth: 0

      - name: Set up pixi
        # Installs the tools frozen in pixi.lock (same versions as locally)
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: v0.50.1
          cache: true

      - name: Render book
        # Fails if a code include cannot be resolved (see the script)
        run: pixi run book --no-execute

      - name: Clean up
        if: always()
        run: rm -rf docs/_output docs/.quarto docs/_freeze
