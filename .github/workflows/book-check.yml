name: Book Render Check

on:
  pull_request:
    paths:
      - 'docs/**'
      # Code files included in the book
      - 'firmware/**/*.ino'
      - 'firmware/**/platformio.ini'
      - 'backend/**/*.py'
      - '.github/workflows/book-check.yml'

permissions:
  contents: read

concurrency:
  group: book-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Quarto book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        working-directory: docs
        # The include-code-files filter only warns when a file is missing:
        # fail explicitly instead of publishing an empty code block
        run: |
          set -o pipefail
          quarto render --to html --no-execute 2>&1 | tee render.log
          if grep -q 'Cannot open file' render.log; then
            echo "::error::Some code includes could not be resolved"
            exit 1
          fi

      - name: Clean up
        if: always()
        run: rm -rf docs/_output docs/.quarto docs/_freeze
