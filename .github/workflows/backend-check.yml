name: Backend Check

on:
  pull_request:
    paths:
      - 'backend/paws/**'
      - '.github/workflows/backend-check.yml'
      # Development environment
      - 'pixi.toml'
      - 'pixi.lock'

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pixi
        # Installs uv at the version frozen in pixi.lock
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: v0.50.1
          cache: true

      - name: Test
        # uv installs Python and the packages frozen in uv.lock, then pytest
        # runs the tests of the API
        run: pixi run backend-test
